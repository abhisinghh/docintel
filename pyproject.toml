[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docintel"
version = "0.1.0"
description = "Agentic document OCR, layout-aware parsing with visual grounding, schema extraction and RAG/KG export"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "pymupdf>=1.24",
  "pillow>=10",
  "numpy>=1.26",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "rapidfuzz>=3.6",
  "pytesseract>=0.3.10",
  "pyyaml>=6",
]

[project.optional-dependencies]
# Local GPU backends (document VLMs served through vLLM / transformers)
vlm = ["vllm>=0.8", "transformers>=4.50", "torch>=2.3", "qwen-vl-utils>=0.0.10"]
# Layout detection models
layout = ["doclayout-yolo>=0.0.4", "huggingface-hub>=0.23"]
# Alternative full pipelines that can be wrapped as backends
docling = ["docling>=2.20"]
paddle = ["paddleocr>=3.0", "paddlex>=3.0"]
# Hosted LLM providers for the agent / schema extraction
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.40"]
# Evaluation
eval = ["datasets>=2.19", "apted>=1.0.3", "distance>=0.1.3", "editdistance>=0.8", "lxml>=5"]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
docintel = "docintel.cli:main"

[tool.setuptools.packages.find]
include = ["docintel*"]

[tool.ruff]
line-length = 110
