# Highest accuracy, no GPU: a frontier VLM does page parsing, charts/maps, agent and extraction.
# Set DOCINTEL_VLM_API_KEY / DOCINTEL_LLM_API_KEY in the environment.
# family "generic" uses a JSON layout prompt that any strong VLM understands.
data_dir: ./data
render_dpi: 200
vlm:
  enabled: true
  provider: openai               # hosted OpenAI-compatible API (or provider: anthropic to parse pages with Claude)
  family: generic
  model: gemini-2.5-pro          # example; any OpenAI-compatible VLM endpoint (Gemini, GPT, Qwen3-VL via OpenRouter)
  base_url: https://generativelanguage.googleapis.com/v1beta/openai
llm:
  provider: anthropic            # Claude for the agent loop + schema extraction + open-IE triples
  model: claude-sonnet-5-5
ocr:
  engine: tesseract
  languages: [eng, hin]
layout:
  engine: heuristic
verify_extractions: true
